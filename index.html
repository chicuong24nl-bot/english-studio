<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10171e"><title>English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#10171e;--card:#18232d;--line:#2b3a48;--text:#e8edf2;--muted:#a1afbc;--teal:#159688;--blue:#4a91d1;--good:#69d69b;--bad:#ff8798;--serif:'Fraunces',Georgia,serif;--sans:'Source Sans 3',system-ui,sans-serif}
    :root[data-theme="light"]{color-scheme:light;--bg:#f5f7f9;--card:#fff;--line:#d5dde5;--text:#16222b;--muted:#586775;--good:#16824b;--bad:#b42338}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
    .auth-view,.wrap{width:min(48rem,100% - 2rem);margin:auto}.auth-view{padding:clamp(2rem,7vw,5rem) 0}.brand{font:700 clamp(2.3rem,7vw,4rem)/1.05 var(--serif);margin:.5rem 0 1rem}.sub{color:var(--muted);margin:.2rem 0 1.4rem}.auth-grid,.grid2,.grid3{display:grid;gap:1rem}.auth-grid,.grid2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.grid3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
    .card,.big,.auth-card,.lesson-card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:1.25rem}.auth-card{margin-top:1rem;padding:clamp(1.2rem,4vw,2rem)}.big,.lesson-card{width:100%;min-height:10rem;text-align:left;display:flex;flex-direction:column;gap:.4rem;transition:transform .12s,border-color .12s}.big:hover,.lesson-card:hover{transform:translateY(-2px);border-color:var(--teal)}.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#54c2b5;font-weight:700}.big h2,.lesson-card h3{font:700 1.5rem/1.2 var(--serif);margin:.2rem 0}.arrow{color:#63cabe;font-weight:700;margin-top:auto}.icon{width:2.7rem;height:2.7rem;border-radius:12px;background:#0e7068;display:grid;place-items:center;font-size:1.25rem}
    .wrap{padding:1rem 0 4rem}.top{position:relative;display:flex;gap:.5rem;align-items:center;padding:.3rem 0 1rem;border-bottom:1px solid var(--line);margin-bottom:1.5rem}.top button{flex:none}.brand-small{font:700 1.2rem var(--serif)}.current-user{margin-left:auto;color:var(--muted);font-size:.9rem}.ib{width:2.5rem;height:2.5rem;border:1px solid var(--line);border-radius:12px;background:var(--card)}.link{border:0;background:none;color:#63cabe;text-decoration:underline;padding:.45rem .2rem;font-weight:700}.btn{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:.65rem 1rem;font-weight:700}.btn.primary{background:#0f7168;border-color:#0f7168;color:#fff}.btn.full{width:100%;margin-top:.5rem}.auth-input,textarea{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:.75rem .85rem;margin:.35rem 0 1rem}.auth-error{color:var(--bad);min-height:1.5rem}.row,.tabbar,.chips{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin:1rem 0}.pill,.tab{border:1px solid var(--line);background:var(--card);padding:.4rem .8rem;border-radius:999px}.pill.active,.tab.active{background:var(--teal);border-color:var(--teal);color:white}.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#63cabe;font-weight:700;margin:0 0 .3rem}h1,h2,h3{font-family:var(--serif);line-height:1.18}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:.2rem 0 .6rem}h2{font-size:1.35rem;margin:.2rem 0 .7rem}h3{font-size:1.1rem;margin:.4rem 0}.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:.6rem;margin:1rem 0}.stat{border:1px solid var(--line);border-radius:12px;padding:.8rem;background:color-mix(in srgb,var(--card) 85%,var(--bg))}.stat b{display:block;font:700 1.4rem var(--serif)}.stat span,.muted{color:var(--muted)}.progress{height:.55rem;border-radius:99px;background:var(--line);overflow:hidden;margin:.7rem 0}.progress i{display:block;height:100%;background:var(--teal)}#popbox .card{position:absolute;right:0;top:3.4rem;z-index:10;width:min(22rem,calc(100vw - 2rem));box-shadow:0 12px 32px #0006}
    .reading p{margin:.7rem 0;font-size:1.06rem}.section-list{display:grid;gap:.6rem;padding:0;list-style:none}.section-list li{padding:.75rem;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 85%,var(--bg))}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:480px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:.65rem .8rem}th{color:#72c8be}tr:last-child td{border:0}.fc{min-height:12rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;border:1px solid var(--line);border-radius:18px;background:var(--card);margin:1rem 0}.fc strong{font:700 clamp(1.4rem,4vw,2rem)/1.25 var(--serif)}.question{font-size:1.2rem}.option{width:100%;text-align:left;display:flex;gap:.7rem;margin:.5rem 0;padding:.75rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--card)}.option.correct{border-color:var(--good);color:var(--good)}.option.incorrect{border-color:var(--bad);color:var(--bad)}.feedback{border:1px solid var(--line);border-radius:12px;padding:1rem;margin:1rem 0;background:color-mix(in srgb,var(--card) 85%,var(--bg))}.score{font:700 2.2rem var(--serif);color:#6bd7c9}.grammar-item{margin:.65rem 0}.grammar-item summary{cursor:pointer;font-weight:700;padding:.8rem}.grammar-content{padding:0 1rem 1rem;color:var(--muted);white-space:normal}.rule{font-family:ui-monospace,monospace;color:#f0e8d6}.roster-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.65rem 0;border-top:1px solid var(--line)}.roster-code{font-family:ui-monospace,monospace;letter-spacing:.05em;font-weight:700;color:#7ce0ce}
    @media(max-width:520px){body{font-size:16px}.top{gap:.3rem}.top .ib{width:2.25rem;height:2.25rem}.current-user{max-width:7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card,.big,.lesson-card{padding:1rem}}
  </style>
</head>
<body>
  <div id="auth-view" class="auth-view"></div>
  <div class="wrap" id="app-root" hidden>
    <header class="top"><button class="ib" id="back" aria-label="Back">←</button><button class="ib" id="home" aria-label="Home">⌂</button><span class="brand-small">English Studio</span><span class="current-user" id="current-user"></span><button class="link" data-auth="logout" id="logout" hidden>Log out</button><button class="ib" id="gear" aria-label="Settings">⚙</button><div id="popbox"></div></header>
    <main id="view"></main>
  </div>
  <script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="content/phase1-data.js"></script><script src="content/grammar-data.js"></script><script src="app.js"></script><script src="auth.js"></script>
</body>
</html>
