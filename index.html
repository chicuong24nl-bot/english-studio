<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.auth-view{max-width:46rem;margin:0 auto;padding:clamp(1rem,5vw,3rem) 1rem}.auth-brand{font:700 clamp(2rem,7vw,3.4rem) var(--hf);line-height:1.1;margin:.6rem 0 1rem}.auth-card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(1.2rem,4vw,2rem);margin:1rem 0}.auth-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1.4rem}.auth-input{width:100%;padding:.75rem .85rem;border:1px solid var(--ln);border-radius:calc(var(--r)*.65);background:var(--bg);margin:.35rem 0 .8rem}.auth-error{color:var(--no);min-height:1.5rem}.current-user{margin-left:auto;color:var(--mut);font-size:.82rem}.roster-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--ln)}.roster-code{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.06em}.auth-view[hidden],#app-root[hidden]{display:none!important}
</style></head><body>
<title>Học tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Bố cục: một cột 46rem, thanh trên cố định, nội dung đổi theo màn hình. Màu chủ đạo và phong cách do người dùng chọn. */
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --fg:#14202B; --mut:#5F6B78; --ln:#D6DCE3;
  --acc:#0F6B63; --ok:#0a7a2f; --no:#b00020; --shade:rgba(20,32,43,.16); --hl:rgba(255,255,255,.9);
  --r:18px; --bw:1px; --bs:solid; --bc:var(--ln); --sh:0 6px 20px rgba(20,32,43,.07); --cardbg:var(--card); --blur:none;
  --hf:'Fraunces',Georgia,serif; --bf:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --acct:color-mix(in srgb,var(--acc) 60%,var(--fg));
  --c2:color-mix(in srgb,var(--acc) 35%,#3b6fc0);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --card:#18212B; --fg:#E8EDF2; --mut:#9AA7B5; --ln:#2B3846; --ok:#6fdc8c; --no:#ff8a9a; --shade:rgba(0,0,0,.5); --hl:rgba(255,255,255,.05); --sh:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --card:#18212B; --fg:#E8EDF2; --mut:#9AA7B5; --ln:#2B3846; --ok:#6fdc8c; --no:#ff8a9a; --shade:rgba(0,0,0,.5); --hl:rgba(255,255,255,.05); --sh:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

:root[data-style="flat"]{--r:6px;--sh:none}
:root[data-style="glass"]{--cardbg:color-mix(in srgb,var(--card) 50%,transparent);--bc:color-mix(in srgb,#fff 45%,transparent);--blur:blur(14px)}
:root[data-style="neu"]{--cardbg:var(--bg);--bw:0px;--sh:6px 6px 14px var(--shade),-6px -6px 14px var(--hl)}
:root[data-style="brutal"]{--r:0px;--bw:2px;--bc:var(--fg);--sh:5px 5px 0 var(--fg);--hf:'Courier New',monospace}
:root[data-style="clay"]{--r:30px;--bw:0px;--sh:8px 10px 20px var(--shade),inset -6px -6px 12px var(--shade),inset 6px 6px 12px var(--hl)}
:root[data-style="minimal"]{--r:0px;--bw:0px;--sh:none;--cardbg:transparent}
:root[data-style="retro"]{--r:0px;--bs:dashed;--sh:none;--hf:'Courier New',monospace}

*{box-sizing:border-box}
html{font-size:17px}
body{background:var(--bg);color:var(--fg);font-family:var(--bf);font-size:1rem;line-height:1.6;margin:0}
:root[data-style="glass"] body{background:radial-gradient(60rem 30rem at 85% -5%,color-mix(in srgb,var(--acc) 30%,transparent),transparent),radial-gradient(40rem 26rem at -5% 60%,color-mix(in srgb,var(--c2) 26%,transparent),transparent),var(--bg)}
.wrap{max-width:46rem;margin:0 auto;padding-inline:1rem;padding-block:1.2rem 3rem}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}

.top{position:relative;display:flex;align-items:center;gap:.6rem;padding-bottom:.9rem;border-bottom:1px solid var(--ln);margin-bottom:1.6rem}
.ib2{width:2.5rem;height:2.5rem;border-radius:var(--r);flex:none;display:grid;place-items:center;font-size:1.25rem;line-height:1;background:var(--cardbg);border:var(--bw) var(--bs) var(--bc);box-shadow:var(--sh);backdrop-filter:var(--blur)}
.ib2.gear{margin-left:auto}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--acc);flex:none}
.name{font-family:var(--hf);font-weight:700;font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{position:absolute;right:0;top:calc(100% + .5rem);z-index:20;width:min(22rem,calc(100vw - 2rem));max-height:75vh;overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 14px 40px var(--shade);padding:1rem;display:flex;flex-direction:column;gap:.55rem}
:root[data-style="brutal"] .pop{border:2px solid var(--fg);box-shadow:5px 5px 0 var(--fg)}
.pl{font-weight:600;font-size:.88rem;margin-top:.3rem}
.pop input[type=range]{width:100%;accent-color:var(--acc)}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.sg{border:1px solid var(--ln);background:var(--bg);border-radius:999px;padding:.3rem .8rem;font-size:.88rem}
.sg.on{background:var(--acc);border-color:var(--acc);color:#fff}
.swatches{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.sw{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--ln)}
.sw.on{border-color:var(--fg)}
#accpick{width:2rem;height:1.8rem;padding:0;border:none;background:none}

.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acct);margin:0 0 .3rem}
h1{font-family:var(--hf);font-weight:700;font-size:clamp(1.8rem,5.5vw,2.4rem);line-height:1.15;margin:0 0 .6rem;text-wrap:balance}
h2{font-family:var(--hf);font-size:1.1rem;margin:0 0 .5rem;line-height:1.3}
h2.sec{margin-top:1.6rem}
h3{font-family:var(--hf);font-size:1.05rem;margin:0 0 .6rem}
.sub{color:var(--mut);margin:0 0 1.3rem}
.lead{font-family:var(--hf);font-weight:600;font-size:1.25rem;line-height:1.45;margin:1rem 0 1.2rem}
.card{background:var(--cardbg);border:var(--bw) var(--bs) var(--bc);border-radius:var(--r);box-shadow:var(--sh);padding:1.3rem;backdrop-filter:var(--blur);margin-bottom:.8rem}
.card.nopad{padding:0;overflow:hidden}
.card ul,.card ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.5rem}
.card h2{margin-bottom:.7rem}
.term{display:flex;flex-direction:column;padding-block:.5rem;border-top:1px solid var(--ln)}
.term:first-child{border-top:none;padding-top:0}
.term:last-child{padding-bottom:0}
.term span{color:var(--fg)}
.deep ol{list-style:none;padding:0}
.deep li .k{display:block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acct)}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;display:flex;gap:.7rem}
.steps li::before{content:counter(s);flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--acc);color:#fff;font-size:.85rem;font-weight:700;display:grid;place-items:center;margin-top:.1rem}
.trap p{margin:0 0 .5rem}.trap p:last-child{margin:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:0 .55rem;margin-right:.5rem}
.tag.no{color:var(--no)}.tag.ok{color:var(--ok)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:.65rem .9rem;border-top:1px solid var(--ln)}
tbody tr:first-child th,tbody tr:first-child td{border-top:none}
thead th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-top:none;background:color-mix(in srgb,var(--acc) 8%,transparent)}
tbody th{width:8.5rem;min-width:7rem;font-weight:700}
.prog{margin:1rem 0 1.2rem}
.ptxt{display:flex;justify-content:space-between;gap:1rem;font-size:.88rem;color:var(--mut);margin-bottom:.4rem;font-variant-numeric:tabular-nums}
.ptxt b{color:var(--fg)}
.segs{display:flex;gap:.3rem}
.seg1{flex:1;height:.55rem;min-width:0;padding:0;border:none;border-radius:999px;background:var(--ln)}
.seg1.done{background:color-mix(in srgb,var(--acc) 55%,var(--ln))}
.seg1.now{background:var(--acc)}
.seg1:focus-visible{outline-offset:3px}
h2.sec.first{margin-top:0}
.pills{display:flex;gap:.45rem;flex-wrap:wrap;margin:.4rem 0}
.pill{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--ln);background:var(--card);font-weight:600}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.btn{border:var(--bw) var(--bs) var(--bc);background:var(--cardbg);border-radius:var(--r);box-shadow:var(--sh);padding:.6rem 1.1rem;font-weight:600;backdrop-filter:var(--blur)}
:root[data-style="clay"] .btn,:root[data-style="neu"] .btn{border-radius:999px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.link{background:none;border:none;color:var(--acct);text-decoration:underline;padding:.3rem 0;font-weight:600}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem}
.big{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:.45rem;min-height:15rem;padding:1.3rem;background:var(--cardbg);border:var(--bw) var(--bs) var(--bc);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:var(--blur);--cc:var(--acc)}
.big.c2{--cc:var(--c2)}
.big>*{position:relative}
.big .glow{position:absolute;width:11rem;height:11rem;border-radius:50%;right:-3rem;top:-3.5rem;background:var(--cc);opacity:.3;filter:blur(2px)}
.big .ib{width:3.4rem;height:3.4rem;border-radius:calc(var(--r)*.7);background:var(--cc);color:#fff;display:grid;place-items:center}
.big .lab{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--cc) 60%,var(--fg))}
.big .bt{font-family:var(--hf);font-weight:700;font-size:1.6rem;line-height:1.2}
.big .bd{color:var(--mut);max-width:22rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{font-size:.8rem;font-weight:600;border:1px solid color-mix(in srgb,var(--cc) 60%,var(--fg));color:color-mix(in srgb,var(--cc) 60%,var(--fg));border-radius:999px;padding:0 .6rem}
.go{margin-top:auto;font-weight:700;color:color-mix(in srgb,var(--cc) 60%,var(--fg))}

.filters{display:grid;grid-template-columns:max-content 1fr;gap:.6rem 1rem;align-items:center;margin-bottom:.8rem}
.filters label{font-weight:600}
select{min-width:0;background:var(--card);border:1px solid var(--ln);border-radius:calc(var(--r)*.6);padding:.5rem .7rem}
@media(max-width:34rem){.filters{grid-template-columns:1fr}}
.full{width:100%;margin-top:.4rem}
.big-n{font-family:var(--hf);font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--acct)}
.mutn{color:var(--mut);font-weight:400;font-size:.9rem}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:2.2rem;background:transparent;margin:.3rem 0 0;touch-action:pan-y}
.slider::-webkit-slider-runnable-track{height:.5rem;border-radius:999px;background:var(--ln)}
.slider::-moz-range-track{height:.5rem;border-radius:999px;background:var(--ln)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:1.6rem;height:1.6rem;margin-top:-.55rem;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 1px 6px var(--shade)}
.slider::-moz-range-thumb{width:1.3rem;height:1.3rem;border-radius:50%;background:var(--acc);border:3px solid var(--card)}

.progress{font-weight:700;margin:0 0 .2rem;font-variant-numeric:tabular-nums}
.fc{width:100%;min-height:9rem;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5rem;text-align:center;padding:1.6rem 1.2rem;background:var(--cardbg);border:var(--bw) var(--bs) var(--bc);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:var(--blur)}
.fc .ft{font-family:var(--hf);font-weight:700;font-size:1.35rem;line-height:1.3}
.fc .cat{font-size:.8rem;color:var(--mut);letter-spacing:.03em}
.fc.back{align-items:flex-start;text-align:left}
.fc .bk{white-space:pre-line}
.src{display:block;font-size:.85rem;color:var(--mut);margin:0}
.qp{font-size:1.2rem;line-height:1.4;margin:.4rem 0 1rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{width:100%;text-align:left;display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .9rem;background:var(--cardbg);border:var(--bw) var(--bs) var(--bc);border-radius:calc(var(--r)*.7);box-shadow:var(--sh)}
.opt .L{flex:none;font-weight:700;color:var(--acct)}
.opt.ok{border:2px solid var(--ok);color:var(--ok)}
.opt.no{border:2px solid var(--no);color:var(--no)}
.opt:disabled{opacity:1}
.hint{color:var(--mut);margin:.2rem 0 0}
.fb{margin-top:1rem;padding:1rem 1.2rem;background:var(--cardbg);border:var(--bw) var(--bs) var(--bc);border-radius:var(--r);box-shadow:var(--sh)}
.fb p{margin:0 0 .5rem}.fb p:last-child{margin:0}
.vd{font-weight:700;font-size:1.1rem}.vd.ok{color:var(--ok)}.vd.no{color:var(--no)}
.bar{height:.6rem;border-radius:999px;background:var(--ln);overflow:hidden;margin:.6rem 0 0}
.bar i{display:block;height:100%;background:var(--acc)}
@media (prefers-reduced-motion:no-preference){.card,.fc,.opt{transition:transform .12s}.fc:active{transform:scale(.99)}}
</style>

<div id="auth-view" class="auth-view"></div>
<div class="wrap" id="app-root" hidden>
  <header class="top">
    <button class="ib2" id="back" aria-label="Quay lại">‹</button>
    <button class="ib2" id="home" aria-label="Về trang chủ">⌂</button>
    <span class="dot" aria-hidden="true"></span>
    <span class="name">Học tập</span><span id="current-user" class="current-user"></span><button class="link" data-auth="logout" id="logout" hidden>Đăng xuất</button>
    <button class="ib2 gear" id="gear" aria-label="Cài đặt giao diện" aria-expanded="false"></button>
    <div id="popbox"></div>
  </header>
  <main id="view"></main>
</div>
<script>
// KHO D — bài tóm tắt 7 chương. Trường: t, tl, kp, tb, kt + mở rộng: ds (giải thích sâu), cmp (so sánh), qt (quy trình), bay (bẫy), tk (tự kiểm tra)
const D = [
{
 t: "Tổng quan về hệ thống thông tin nhân lực",
 tl: "Chương 1 trả lời câu hỏi «vì sao nhân sự cần một hệ thống thông tin»: khi tổ chức lớn lên, số nghiệp vụ nhân sự tăng, nên **HRIS là hệ thống thông tin hỗ trợ các chức năng quản trị nhân sự** — và nó là nền cho mọi chương sau (thiết kế, tuyển dụng, đào tạo, lương thưởng).",
 kp: [
  "Thiếu HRIS, tổ chức gặp: tiền lương không đúng hạn, bổ sung nhân sự chậm, xử lý hồ sơ kém hiệu quả, đào tạo trễ hạn.",
  "Nhân lực là nguồn lực quan trọng nhất: vừa trực tiếp làm các việc không thể tự động hoá, vừa là nguồn lực tri thức điều khiển các nguồn lực khác.",
  "HRIS hỗ trợ 8 nhóm quyết định: tuyển chọn, đánh giá, đề bạt/thuyên chuyển, đào tạo phát triển, lương thưởng bảo hiểm, phân tích thiết kế công việc, báo cáo nhà nước, kế hoạch nhu cầu nhân lực.",
  "Lợi ích của HRIS: bức tranh thông tin nhân sự, tăng năng lực cạnh tranh, nâng cao hiệu lực và hiệu quả. Rủi ro: quyền riêng tư, căng thẳng áp lực, cứng nhắc thiếu linh hoạt.",
  "Dữ liệu qua xử lý (phân loại, sắp xếp, tổng hợp, tính toán, chọn lựa) thành thông tin; thông tin kết hợp kinh nghiệm và phán quyết thành tri thức.",
  "HTTT có 5 thành phần (phần cứng, phần mềm, dữ liệu, mạng, con người) và nhiều dự án HTTT thất bại: chỉ 16% hoàn thành, 53% chậm, 31% bị hủy."
 ],
 tb: [
  ["Mục tiêu","Hiểu HRIS, eHRM, cơ sở dữ liệu, quy trình thiết kế – triển khai, yếu tố thành công, chi phí và ứng dụng trong các hoạt động HR."],
  ["Phân loại HRIS","Hoạt động hằng ngày · Chức năng quản lý · Quy trình thực hiện · Định hướng chiến lược."],
  ["Phát triển","Thủ công trên giấy → sau 1945 (tuyển dụng, đào tạo, máy vi tính) → Internet (website, intranet) → hiện nay (tư vấn, thiết kế chiến lược, Big data, AI)."],
  ["Bộ máy nhân sự HTTT","CIO · các chuyên gia HTTT · người dùng cuối (cần được đào tạo)."],
  ["Thách thức","Thiết kế tồi, dữ liệu thiếu chính xác, chi phí vượt trội, hệ thống gián đoạn; sức ỳ của tổ chức; thiếu kinh nghiệm của người dùng."]
 ],
 kt: [
  ["HRIS","Hệ thống thông tin tập trung hỗ trợ các chức năng và hoạt động của quản trị nhân sự."],
  ["eHRM","Phần mềm quản lý nhân sự cho doanh nghiệp đa quốc gia: trả lương nhiều loại tiền tệ, lịch làm việc, ca làm việc, lịch nghỉ lễ theo quốc gia."],
  ["Tri thức","Thông tin được kết hợp với kinh nghiệm và sự phán quyết; là kho tàng hiểu biết và kỹ năng từ trí tuệ con người."]
 ],
 ds: [
  {n:"Dữ liệu – Thông tin – Tri thức",
   a:"Dữ liệu là số liệu hay sự kiện; thông tin là dữ liệu được đặt trong bối cảnh; tri thức là thông tin kết hợp với kinh nghiệm và sự phán quyết.",
   b:"Dữ liệu là con số trần; thông tin là con số đã được «đọc» trong ngữ cảnh; tri thức là khi người có kinh nghiệm nhìn ra quy luật để ra quyết định.",
   c:"Ví dụ: «35» chỉ là dữ liệu; «35 nhân viên nghỉ việc trong quý này» là thông tin; nhận ra «nghỉ nhiều vì lương thấp hơn thị trường» rồi điều chỉnh chính sách là tri thức.",

 ["Unfreezing","Freezing","Cả ba giai đoạn cùng lúc"],
 "Change gồm chấm dứt cái cũ, bước đệm và áp dụng cái mới. Họp giải thích lý do thuộc Unfreezing; cố định quy trình mới và điều chỉnh thuộc Freezing.",
 "Có «chấm dứt cái cũ» và «áp dụng cái mới».");

/* ===== CHƯƠNG 3 ===== */
q(3,"Nhớ","Hai «sản phẩm» của phân tích công việc là gì?",
 "Bản mô tả công việc và Bản tiêu chuẩn nhân viên",
 ["Sơ đồ tổ chức và kế hoạch hoạt động","Bản câu hỏi và nhật ký công việc","Báo cáo ngân lưu và bảng cân đối kế toán"],
 "Sản phẩm: bản mô tả công việc và bản tiêu chuẩn nhân viên. Sơ đồ tổ chức, kế hoạch là thông tin thứ cấp; bản câu hỏi, nhật ký là phương pháp thu thập thông tin sơ cấp.",
 "Một bản nói về công việc, một bản nói về người làm.");
q(3,"Hiểu","Thông tin nào dưới đây là thông tin THỨ CẤP trong phân tích công việc?",
 "Sơ đồ tổ chức của doanh nghiệp",
 ["Thông tin cụ thể từ người thực hiện công việc","Thông tin chung từ người quản lý trực tiếp","Kết quả quan sát nhân viên đang làm việc"],
 "Thứ cấp là thông tin sẵn có (sơ đồ tổ chức, chức năng nhiệm vụ phòng ban, kế hoạch, cơ cấu lao động, quy trình sản xuất, hồ sơ nhân viên). Thông tin từ người quản lý trực tiếp và người thực hiện công việc là sơ cấp.",
 "Thứ cấp = có sẵn trong tài liệu.");
q(3,"Nhớ","Phương pháp nào dưới đây dùng để thu thập thông tin SƠ CẤP?",
 "Nhật ký công việc",
 ["Cơ cấu lao động","Quy trình sản xuất","Sơ đồ tổ chức"],
 "Sơ cấp: bản câu hỏi, phỏng vấn, nhật ký công việc, quan sát. Ba phương án còn lại là nguồn thông tin thứ cấp.",
 "Phương pháp = phải tự đi thu thập.");
q(3,"Hiểu","Điểm khác biệt cốt lõi giữa trung tâm dịch vụ chia sẻ và thuê ngoài là gì?",
 "Trung tâm chia sẻ làm các nhiệm vụ tác nghiệp để lãnh đạo tập trung quản trị; thuê ngoài chuyển chức năng ra bên ngoài",
 ["Trung tâm dịch vụ chia sẻ luôn do nhà cung cấp ở nước ngoài thực hiện","Thuê ngoài do người dùng tự thao tác trên website","Hai hình thức hoàn toàn giống nhau"],
 "Trung tâm chia sẻ đảm nhiệm các nhiệm vụ tác nghiệp cụ thể để ban lãnh đạo tập trung vào vai trò quản trị; thuê ngoài chuyển một phần chức năng ra thực hiện ở bên ngoài. «Nhà cung cấp ở nước ngoài» là thuê ngoài đặc biệt; «tự thao tác trên website» là cổng tự phục vụ.",
 "Một bên làm tập trung nội bộ, bên kia giao ra ngoài.");
q(3,"Áp dụng","Nhân viên tự xem phiếu lương và nộp đơn xin nghỉ phép trên cổng nội bộ. Đây là hình thức cung ứng dịch vụ nhân sự nào?",
 "Cổng tự phục vụ (SSP)",
 ["Trung tâm dịch vụ chia sẻ","Thuê ngoài","Thuê ngoài với nhà cung cấp ở nước ngoài"],
 "Người dùng được ủy quyền tự thao tác trên website là đặc trưng của cổng tự phục vụ; bài giảng nêu các ứng dụng SSP liên quan đến nhân viên và nhà quản lý.",
 "Ai thao tác? Chính người dùng.");
q(3,"Áp dụng","Công ty thiếu nhân lực đột xuất nên thuê bên ngoài lo bảng lương. Rủi ro nào được bài giảng nêu cho hình thức này?",
 "Mất kiểm soát, rủi ro an toàn bảo mật, quản lý chi phí không chặt chẽ",
 ["Dấu ấn con người giảm","Giả danh và đẩy công việc admin","Thiếu sự đồng bộ"],
 "Nhược điểm thuê ngoài: mất kiểm soát, không dùng kinh nghiệm nội bộ, rủi ro bảo mật, quản lý chi phí lỏng. «Dấu ấn con người giảm» và «thiếu đồng bộ» là của dịch vụ chia sẻ; «giả danh, đẩy việc admin» là của SSP.",
 "Đối chiếu từng nhược điểm với đúng hình thức.");
q(3,"Nhớ","Hai lý thuyết nền tảng được nhắc đến trong phần hình thức cung ứng dịch vụ nhân sự là gì?",
 "Dựa vào nguồn lực và Chi phí giao dịch",
 ["Lewin và Nadler","Pareto và Kaldor-Hicks","KPI và IDP"],
 "Slide «Các lý thuyết nền tảng» nêu: Dựa vào nguồn lực; Chi phí giao dịch. Các phương án khác thuộc quản lý thay đổi, CBA và quản trị thực hiện công việc.",
 "Một lý thuyết nói về nguồn lực, một nói về chi phí.");
q(3,"Nhớ","Bước đầu tiên trong phân tích công việc là gì?",
 "Nhận diện các nguồn thông tin về công việc",
 ["Xác định phương pháp thu thập dữ liệu","Phỏng vấn người thực hiện công việc","Viết bản tiêu chuẩn nhân viên"],
 "Thứ tự: nhận diện nguồn thông tin → nhận diện dạng thông tin và dữ liệu → xác định phương pháp thu thập dữ liệu.",
 "Cần biết lấy từ đâu trước.");
q(3,"Áp dụng","Nguyễn Văn An được tuyển từ 01.01.2018 (hợp đồng 1 năm), tái ký 01.01.2019 (3 năm). File dữ liệu mẫu giúp công ty làm gì?",
 "Truy xuất hồ sơ bất cứ khi nào, cập nhật thường xuyên và cảnh báo nhân viên hết hạn hợp đồng",
 ["Tính NPV của dự án","Chấm công và tính lương tăng ca","Đánh giá 5 cấp độ đào tạo"],
 "Kịch bản quản lý hồ sơ cá nhân, lịch sử làm việc và hợp đồng lao động; lợi ích là truy xuất đầy đủ, cập nhật thường xuyên, cảnh báo hết hạn hợp đồng.",
 "Chủ đề: thông tin nhân viên và hợp đồng lao động.");

/* ===== CHƯƠNG 4 ===== */
q(4,"Nhớ","Quá trình quản trị thực hiện công việc (PM) gồm các bước theo thứ tự nào?",
 "Lập kế hoạch → nhân viên thực hiện công việc → đánh giá, khen thưởng, phát triển",
 ["Đánh giá → lập kế hoạch → nhân viên thực hiện công việc","Nhân viên thực hiện công việc → lập kế hoạch → đánh giá","Lập kế hoạch → đánh giá → nhân viên thực hiện công việc"],
 "PM: lập kế hoạch (thiết kế mục tiêu, thỏa thuận) → thực hiện (quan sát, động viên, huấn luyện) → đánh giá, khen thưởng, phát triển (KPI, IDP).",
 "Phải có mục tiêu trước khi đánh giá.");
q(4,"Nhớ","Trong kịch bản công ty ABC, ký hiệu «K» trên bảng chấm công nghĩa là gì?",
 "Nghỉ không lương",
 ["Nghỉ phép năm","Tăng ca ngày thường","Ngày công đi làm"],
 "Ký hiệu: X – ngày công đi làm; P – nghỉ phép năm; K – nghỉ không lương; TCT – tăng ca ngày thường.",
 "K đứng đầu từ «không lương».");
q(4,"Hiểu","Phúc lợi bắt buộc khác phúc lợi tự nguyện ở điểm cốt lõi nào?",
 "Bắt buộc dựa trên yêu cầu của pháp luật; tự nguyện tùy khả năng tài chính và sự quan tâm của doanh nghiệp",
 ["Bắt buộc do doanh nghiệp tự quyết; tự nguyện do pháp luật quy định","Bắt buộc chỉ dành cho nhà quản lý; tự nguyện dành cho nhân viên","Bắt buộc là thù lao, tự nguyện là phúc lợi"],
 "Phúc lợi bắt buộc đảm bảo cho nhân viên theo yêu cầu của pháp luật; phúc lợi tự nguyện tùy thuộc khả năng tài chính và sự quan tâm của doanh nghiệp. Bài giảng cũng lưu ý Phúc lợi ≠ Thù lao.",
 "Căn cứ pháp lý khác căn cứ doanh nghiệp.");
q(4,"Hiểu","Theo bài giảng, dữ liệu chi trả lương thường được dùng chủ yếu cho mục đích nào?",
 "Kiểm toán",
 ["Ra quyết định thăng chức","Xác định nhu cầu đào tạo","Tuyển dụng ứng viên"],
 "Bài giảng nhận xét dữ liệu chi trả lương thường không được HR và quản lý cấp trung quan tâm cho ra quyết định, chỉ thường dùng cho mục đích kiểm toán.",
 "Dữ liệu tiền lương hay được đối chiếu bởi ai?");
q(4,"Áp dụng","Nguyễn Văn An có lương cơ bản 20.000.000 đồng, ngày công chuẩn 26 và tăng ca 4 giờ (17h–21h). Theo công thức của bài, lương tăng ca khoảng bao nhiêu?",
 "Khoảng 576.923 đồng",
 ["Khoảng 384.615 đồng","Khoảng 4.615.385 đồng","Khoảng 15.000.000 đồng"],
 "Lương tăng ca = (giờ tăng ca × 1,5) × (lương cơ bản / ngày công chuẩn / 8) = (4 × 1,5) × (20.000.000 / 26 / 8) = 6 × 96.153,85 ≈ 576.923. Quên hệ số 1,5 cho kết quả ≈ 384.615; quên chia 8 cho ≈ 4.615.385.",
 "Đừng quên hệ số 1,5 và chia cho 26 rồi chia cho 8.");
q(4,"Hiểu","Báo cáo nào là báo cáo điển hình của hệ thống quản trị thực hiện công việc (PM)?",
 "Đánh giá tóm tắt hàng năm với mỗi nhân viên",
 ["Khảo sát lương","Ngân sách dành cho thù lao","Cơ hội bình đẳng cho nhân viên"],
 "Báo cáo PM: hợp đồng công việc từng nhân viên, đánh giá tóm tắt hàng năm, dữ liệu kết quả tổng hợp của bộ phận, báo cáo so sánh kết quả với đầu ra mong muốn. Ba phương án còn lại là báo cáo thù lao.",
 "Phân biệt báo cáo PM với báo cáo thù lao.");
q(4,"Nhớ","Thành phần nào sau đây thuộc hệ thống thù lao?",
 "Perquisites",
 ["IDP","KPI","Payroll"],
 "Hệ thống thù lao gồm base pay, merit pay, short-term incentive, long-term incentive, attraction awards, retention, perquisites, recognition awards. KPI và IDP thuộc đánh giá PM; payroll là chi trả lương.",
 "Từ này nói về «đặc quyền/ưu đãi kèm theo».");
q(4,"Áp dụng","Công ty thưởng theo chỉ tiêu KPI và thống nhất kế hoạch phát triển cá nhân (IDP) với nhân viên. Việc này thuộc bước nào của PM?",
 "Đánh giá – Khen thưởng – Phát triển",
 ["Lập kế hoạch công việc","Nhân viên thực hiện công việc","Chi trả lương"],
 "Bước đánh giá – khen thưởng – phát triển: tóm lược kết quả, đối chiếu mục tiêu, thưởng theo KPI, thống nhất IDP.",
 "Thưởng KPI diễn ra khi đã có kết quả.");
q(4,"Nhớ","Ngày công chuẩn của công ty ABC trong kịch bản thực hành là bao nhiêu?",
 "26 ngày",
 ["22 ngày","24 ngày","30 ngày"],
 "Công ty ABC làm sáng 8h–12h, chiều 13h–17h, nghỉ chủ nhật, ngày công chuẩn 26 ngày.",
 "Nghỉ chủ nhật hàng tuần.");

/* ===== CHƯƠNG 5 ===== */
q(5,"Nhớ","Quá trình tuyển dụng gồm những hoạt động nào, liên kết chặt chẽ với nhau?",
 "Tuyển mộ, tuyển chọn, bố trí",
 ["Tuyển mộ, đào tạo, đánh giá","Phân tích công việc, tuyển chọn, bố trí","Tuyển chọn, đề bạt, thuyên chuyển"],
 "Bài giảng: tuyển dụng gồm tuyển mộ, tuyển chọn, bố trí.",
 "Ba từ bắt đầu bằng «tuyển», «tuyển», «bố».");
q(5,"Nhớ","Tuyển mộ là gì?",
 "Quá trình thu hút những ứng viên có năng lực phù hợp tham gia vào quá trình tuyển chọn của công ty",
 ["Quá trình quyết định ứng viên nào được nhận vào làm","Quá trình sắp xếp nhân sự vào vị trí thích hợp","Quá trình cung cấp kỹ năng cụ thể cho nhân viên mới"],
 "Tuyển mộ là bước thu hút ứng viên vào quá trình tuyển chọn; việc quyết định nhận ai là tuyển chọn; sắp xếp vào vị trí là bố trí.",
 "Từ khoá «thu hút».");
q(5,"Hiểu","Mục tiêu nào được bài giảng nêu cho tuyển mộ?",
 "Tạo nguồn sinh lực mới cho doanh nghiệp",
 ["Giảm số ứng viên nộp đơn","Hạn chế thay đổi nhân sự","Chỉ lấp các vị trí đang trống trước mắt"],
 "Mục tiêu gồm thu hút người tài, bổ nhiệm và bố trí lại nhân sự, kích thích tinh thần làm việc, tạo nguồn sinh lực mới, phát triển văn hóa, tăng lợi thế cạnh tranh.",
 "Mục tiêu hướng đến tăng chất lượng, không phải hạn chế.");
q(5,"Nhớ","Nhân tố nào được nêu là ảnh hưởng đến tuyển mộ?",
 "Uy tín của doanh nghiệp",
 ["Ngày công chuẩn","Mô hình Lewin","Phương pháp kèm cặp"],
 "8 nhân tố: uy tín doanh nghiệp, thông báo tuyển dụng, chính sách quản lý nhân sự, quan hệ với trung tâm giới thiệu việc làm, tài chính công ty, mối quan tâm giữa các ngành nghề, thị trường lao động, đối thủ cạnh tranh cùng ngành.",
 "Nhân tố liên quan đến hình ảnh công ty.");
q(5,"Hiểu","Lợi ích của nguồn tuyển mộ bên trong là gì?",
 "Nhân viên nắm bắt và thực hiện công việc nhanh hơn",
 ["Luôn mang lại ý tưởng sáng tạo mới","Mọi trường hợp đều tăng đoàn kết nội bộ","Không cần thông báo tuyển dụng"],
 "Lợi ích: biết năng lực và phẩm chất, nắm việc nhanh hơn, tiết kiệm thời gian và chi phí, tạo cơ hội thăng tiến. Nhược điểm: làm theo khuôn rập, mất đoàn kết nếu thực hiện không tốt.",
 "Ứng viên nội bộ đã quen với công ty.");
q(5,"Hiểu","Nhược điểm của nguồn tuyển mộ bên trong là gì?",
 "Nhân viên có thể làm việc theo khuôn rập, thiếu sáng tạo, thi đua",
 ["Tốn nhiều thời gian và chi phí tuyển dụng","Không biết năng lực, phẩm chất của ứng viên","Không tạo cơ hội thăng tiến"],
 "Nguồn bên trong tiết kiệm thời gian, chi phí; công ty biết rõ ứng viên; có cơ hội thăng tiến. Nhược điểm bài nêu là làm theo khuôn rập và nguy cơ mất đoàn kết nội bộ.",
 "Ba phương án sai đều là ưu điểm bị đảo ngược.");
q(5,"Áp dụng","Công ty đề bạt một nhân viên dựa trên quá trình làm việc, trình độ và thành tích. Đây là nguồn tuyển mộ nào?",
 "Nguồn bên trong",
 ["Nguồn bên ngoài","Trung tâm giới thiệu việc làm","Thuê ngoài"],
 "Đề bạt dựa trên thông tin về quá trình làm việc, trình độ, thành tích cá nhân là một cách tuyển mộ từ nguồn bên trong (cùng với giới thiệu từ cán bộ công nhân và thông báo công khai).",
 "Người được đề bạt đã là nhân viên công ty.");
q(5,"Áp dụng","Một nhân viên được đề bạt nhưng làm việc không tốt, khiến quan hệ nội bộ căng thẳng. Bài giảng gọi đây là nhược điểm nào của nguồn bên trong?",
 "Thực hiện không tốt dẫn đến mất đoàn kết nội bộ",
 ["Nhân viên làm việc theo khuôn rập","Tốn thời gian và chi phí tuyển dụng","Công ty không biết năng lực của nhân viên"],
 "Nhược điểm thứ hai của nguồn bên trong: thực hiện không tốt thì mất đoàn kết nội bộ. Nhược điểm thứ nhất là làm việc theo khuôn rập.",
 "Tình huống có «quan hệ nội bộ».");

/* ===== CHƯƠNG 6 ===== */
q(6,"Nhớ","Đào tạo được định nghĩa là gì?",
 "Quá trình cung cấp cho nhân viên những kỹ năng cụ thể hoặc giúp họ sửa chữa sai sót trong thực hiện công việc",
 ["Những nỗ lực cung cấp khả năng mà tổ chức sẽ cần trong tương lai","Quá trình thu hút ứng viên có năng lực phù hợp","Việc đánh giá kết quả của chương trình sau khi triển khai"],
 "Phương án đầu tiên sai là định nghĩa phát triển. Đào tạo hướng đến kỹ năng cụ thể và sửa sai sót hiện tại.",

/* ===== Bộ sinh thẻ và câu hỏi (thuần, kiểm thử được) ===== */
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inScope = (c, scope) => scope === 'all' || c === scope + 1;
const up = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCards(scope) {
  const out = [];
  BK.filter(it => inScope(it.c, scope)).forEach(it => {
    const src = 'Chương ' + it.c + (it.x ? ' · ' + it.x : '');
    if (it.k === 'df') out.push({ c: it.c, x: it.x, front: it.t, back: up(it.d), src });
    else if (it.k === 'ls') out.push({ c: it.c, x: it.x, front: it.t, back: it.li.map((s, i) => (it.o ? (i + 1) + '. ' : '• ') + s).join('\n'), src });
    else if (it.k === 'tb') it.r.forEach(row => {
      const rest = row.map((v, j) => j === it.tc ? null : it.h[j] + ': ' + v).filter(Boolean).join('\n');
      out.push({ c: it.c, x: 'Bảng: ' + it.x, front: row[it.tc], back: rest, src });
    });
  });
  CF.filter(f => inScope(f.c, scope)).forEach(f =>
    out.push({ c: f.c, x: '', front: f.front, back: f.back, src: 'Chương ' + f.c + ' · Thẻ biên soạn', cat: f.cat, diff: f.diff }));
  return out;
}

function pickWrong(it, key, n, kind) {
  const pool = BK.filter(o => o.k === kind);
  const seen = new Set([key(it)]);
  const tiers = [
    pool.filter(o => o !== it && o.x && o.x === it.x && o.c === it.c),
    pool.filter(o => o !== it && o.c === it.c),
    pool.filter(o => o !== it)
  ];
  const out = [];
  for (const t of tiers) for (const o of shuf(t)) {
    const k = key(o); if (!k || seen.has(k)) continue;
    seen.add(k); out.push(o); if (out.length === n) return out;
  }
  return out;
}
const finish = (p, correct, wrongs, full, note, src, item, extra) => {
  const all = shuf([{ t: correct, ok: true }].concat(wrongs));
  return Object.assign({ p, opts: all.map(o => o.t), ai: all.findIndex(o => o.ok), full, note: i => (all[i].note || ''), src, item, auto: true }, extra || {});
};

function genDf(it) {
  const src = 'Chương ' + it.c + (it.x ? ' · ' + it.x : '');
  const pre = it.x ? 'Trong «' + it.x + '», ' : '';
  const full = '«' + it.t + '»: ' + it.d;
  if (Math.random() < 0.5) {
    const w = pickWrong(it, o => o.d, 3, 'df'); if (w.length < 3) return null;
    return finish(up(pre + '«' + it.t + '» nghĩa là gì?'), it.d, w.map(o => ({ t: o.d, note: 'Phương án em chọn là nghĩa của «' + o.t + '».' })), full, null, src, it);
  }
  const w = pickWrong(it, o => o.t, 3, 'df'); if (w.length < 3) return null;
  return finish(up(pre + 'khái niệm nào có nghĩa: «' + it.d + '»?'), it.t, w.map(o => ({ t: o.t, note: '«' + o.t + '» nghĩa là: ' + o.d })), full, null, src, it);
}
function genTb(it) {
  const src = 'Chương ' + it.c + ' · ' + it.x;
  const cols = it.h.map((_, j) => j).filter(j => j !== it.tc);
  for (let tries = 0; tries < 8; tries++) {
    const ri = Math.floor(Math.random() * it.r.length), cj = cols[Math.floor(Math.random() * cols.length)];
    const ans = it.r[ri][cj]; if (!ans) continue;
    const seen = new Set([ans]), ws = [];
    shuf(it.r.map((r, i) => i)).forEach(i => { const v = it.r[i][cj]; if (i !== ri && v && !seen.has(v)) { seen.add(v); ws.push({ t: v, note: 'Phương án em chọn thuộc hàng «' + it.r[i][it.tc] + '».' }); } });
    if (ws.length < 2) continue;
    const full = it.h.map((h, j) => h + ': ' + it.r[ri][j]).join(' | ');
    return finish('Theo bảng «' + it.x + '»: với «' + it.r[ri][it.tc] + '», mục «' + it.h[cj] + '» là gì?', ans, ws.slice(0, 3), full, null, src, it);
  }
  return null;
}
function genLs(it) {
  const src = 'Chương ' + it.c + ' · ' + it.x;
  const ans = it.li[Math.floor(Math.random() * it.li.length)];
  const own = new Set(it.li);
  const pool = BK.filter(o => o.k === 'ls' && o !== it);
  const tiers = [pool.filter(o => o.c === it.c), pool];
  const ws = [], seen = new Set();
  outer: for (const t of tiers) for (const o of shuf(t)) {
    const s = o.li[Math.floor(Math.random() * o.li.length)];
    if (own.has(s) || seen.has(s)) continue;
    seen.add(s); ws.push({ t: s, note: 'Phương án em chọn thuộc «' + o.t + '» (' + o.x + ').' });
    if (ws.length === 3) break outer;
  }
  if (ws.length < 3) return null;
  const full = 'Đầy đủ: ' + it.li.map((s, i) => (it.o ? (i + 1) + '. ' : '') + s).join(' | ');
  return finish('Nội dung nào thuộc «' + it.t + '» (trong «' + it.x + '»)?', ans, ws, full, null, src, it);
}
const genBK = it => it.k === 'df' ? genDf(it) : it.k === 'tb' ? genTb(it) : genLs(it);

function fromCQ(it) {
  const all = shuf([{ t: it.a, ok: true }].concat(it.w.map(t => ({ t }))));
  return { p: it.p, opts: all.map(o => o.t), ai: all.findIndex(o => o.ok), full: it.a, note: () => '', e: it.e, h: it.h, bloom: it.b,
    src: 'Chương ' + it.c + ' · Câu hỏi biên soạn', item: it, auto: false };
}
function makeQuiz(scope, qn, only) {
  const out = [];
  const mk = it => it.p ? fromCQ(it) : genBK(it);
  if (only) {
    shuf(only).forEach(it => { if (out.length < qn) { const x = mk(it); if (x) out.push(x); } });
    return out;
  }
  const cur = shuf(CQ.filter(c => inScope(c.c, scope)));
  const bk = shuf(BK.filter(c => inScope(c.c, scope)));
  const nCur = Math.min(cur.length, Math.round(qn * 0.6));
  cur.slice(0, nCur).forEach(it => out.push(fromCQ(it)));
  for (const it of bk) { if (out.length >= qn) break; const x = genBK(it); if (x) out.push(x); }
  for (const it of cur.slice(nCur)) { if (out.length >= qn) break; out.push(fromCQ(it)); }
  return shuf(out);
}

function go(mode) { S.hist.push([S.mode, S.cur]); S.mode = mode; if (mode === 'learn') S.step = 0; render(); window.scrollTo(0, 0); }
function back() { const t = S.hist.pop(); if (t) { S.mode = t[0]; S.cur = t[1]; } else S.mode = 'home'; render(); window.scrollTo(0, 0); }
function home() { S.hist = []; S.mode = 'home'; render(); window.scrollTo(0, 0); }

function startCards() { S.cards = shuf(buildCards(S.scope)).slice(0, S.cn); S.ci = 0; S.flip = false; go('cards'); }
function startQuiz(only) {
  S.qz = makeQuiz(S.scope, S.qn, only); S.qi = 0; S.sc = 0; S.done = false; S.wrong = []; S.picked = -1; S.hint = false;
  if (only) { S.mode = 'quiz'; render(); window.scrollTo(0, 0); } else go('quiz');
}
function pick(i) {
  if (S.picked >= 0) return;
  S.picked = i; const q = S.qz[S.qi];
  if (i === q.ai) S.sc++; else S.wrong.push(q.item);
  render();
}
function nextQ() {
  if (S.qi + 1 >= S.qz.length) S.done = true; else { S.qi++; S.picked = -1; S.hint = false; }
  render(); window.scrollTo(0, 0);
}

  const nCards = buildCards('all').length;
  return '<p class="eyebrow">Hệ thống thông tin nhân sự</p><h1>Hôm nay em muốn làm gì?</h1>' +
    '<p class="sub">Chọn một chế độ. Dùng ⌂ bất cứ lúc nào để quay về đây.</p>' +
    '<div class="grid2">' +
    '<button class="big c1" data-act="to-review"><span class="glow"></span><span class="ib">' + ICON_TARGET + '</span><span class="lab">Ôn bài</span><span class="bt">Công cụ ôn tập</span><span class="bd">Flashcard và trắc nghiệm từ các khái niệm, bước và bảng so sánh trong bài giảng.</span><span class="chips"><span class="chip">' + nCards + ' thẻ</span><span class="chip">2 chế độ</span></span><span class="go">Bắt đầu ôn →</span></button>' +
    '<button class="big c2" data-act="to-learn"><span class="glow"></span><span class="ib">' + ICON_BOOK + '</span><span class="lab">Bài giảng</span><span class="bt">Xem bài giảng</span><span class="bd">Đọc tóm tắt từng chương: ý chính, bảng tóm lược, thuật ngữ, so sánh và bẫy hay sai.</span><span class="chips"><span class="chip">' + D.length + ' chương</span><span class="chip">' + TERMS + ' thuật ngữ</span></span><span class="go">Mở bài giảng →</span></button>' +
    '</div>';
}

function learnSecs(d) {
  const s = [];
  s.push(['Tóm tắt', '<p class="lead">' + bold(d.tl) + '</p>']);
  s.push(['Ý chính', '<div class="card"><h2>Ý chính</h2><ul>' + d.kp.map(k => '<li>' + esc(k) + '</li>').join('') + '</ul></div>']);
  s.push(['Tóm lược', '<h2 class="sec first">Tóm lược</h2><div class="card nopad">' + table(d.tb, null, true) + '</div>']);
  s.push(['Thuật ngữ', '<h2 class="sec first">Thuật ngữ</h2><div class="card">' + d.kt.map(k => '<div class="term"><b>' + esc(k[0]) + '</b><span>' + esc(k[1]) + '</span></div>').join('') + '</div>']);
  if (d.ds && d.ds.length) s.push(['Giải thích sâu', '<h2 class="sec first">Giải thích sâu</h2>' + d.ds.map(x => '<div class="card deep"><h3>' + esc(x.n) + '</h3><ol>' +
    '<li><span class="k">Định nghĩa gốc</span>' + esc(x.a) + '</li><li><span class="k">Nói đời thường</span>' + esc(x.b) + '</li>' +
    '<li><span class="k">Ví dụ</span>' + esc(x.c) + '</li><li><span class="k">Dễ nhầm</span>' + esc(x.d) + '</li></ol></div>').join('')]);
  if (d.cmp) s.push(['So sánh', '<h2 class="sec first">Bảng so sánh</h2><div class="card nopad">' + table(d.cmp.r, d.cmp.h, true) + '</div>']);
  if (d.qt) s.push(['Quy trình', '<h2 class="sec first">' + esc(d.qt.t) + '</h2><div class="card"><ol class="steps">' + d.qt.li.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></div>']);
  if (d.bay) s.push(['Bẫy hay sai', '<h2 class="sec first">Bẫy hay sai</h2>' + d.bay.map(b => '<div class="card trap"><p><span class="tag no">Ngộ nhận</span>' + esc(b[0]) + '</p><p><span class="tag ok">Thực ra</span>' + esc(b[1]) + '</p></div>').join('')]);
  if (d.tk) s.push(['Tự kiểm tra', '<h2 class="sec first">Tự kiểm tra</h2><div class="card"><ul>' + d.tk.map(k => '<li>' + esc(k) + '</li>').join('') + '</ul></div>']);
  return s;
}
function vLearn() {
  const d = D[S.cur], secs = learnSecs(d), n = secs.length;
  S.step = Math.max(0, Math.min(S.step, n - 1));
  let h = '<p class="eyebrow">Bài giảng</p><h1>Chương ' + (S.cur + 1) + ' — ' + esc(d.t) + '</h1>';
  h += '<div class="pills" aria-label="Chọn chương">' + D.map((_, i) => '<button class="pill' + (i === S.cur ? ' on' : '') + '" data-act="chap" data-i="' + i + '" aria-label="Chương ' + (i + 1) + '"' + (i === S.cur ? ' aria-current="true"' : '') + '>' + (i + 1) + '</button>').join('') + '</div>';
  h += '<div class="prog"><div class="ptxt"><span>Phần <b>' + (S.step + 1) + '</b> / ' + n + ' · ' + esc(secs[S.step][0]) + '</span><span>' + Math.round((S.step + 1) / n * 100) + '%</span></div>' +
    '<div class="segs" role="progressbar" aria-valuemin="1" aria-valuemax="' + n + '" aria-valuenow="' + (S.step + 1) + '">' + secs.map((s, i) => '<button class="seg1' + (i < S.step ? ' done' : i === S.step ? ' now' : '') + '" data-act="step" data-i="' + i + '" aria-label="Phần ' + (i + 1) + ': ' + esc(s[0]) + '"></button>').join('') + '</div></div>';
  h += '<div class="stepbody">' + secs[S.step][1] + '</div>';
  const last = S.step === n - 1;
  h += '<div class="row"><button class="btn" data-act="sprev"' + (S.step === 0 ? ' disabled' : '') + '>‹ Phần trước</button>' +
    (last ? '<button class="btn pri" data-act="drill">Ôn chương này</button>' + (S.cur < D.length - 1 ? '<button class="btn" data-act="chap" data-i="' + (S.cur + 1) + '">Chương ' + (S.cur + 2) + ' ›</button>' : '')
          : '<button class="btn pri" data-act="snext">Phần tiếp ›</button>') + '</div>';
  return h;
}
const MAXC = {};
function maxFor(kind, scope) {
  const k = kind + scope;
  if (MAXC[k] == null) MAXC[k] = kind === 'cards' ? buildCards(scope).length : makeQuiz(scope, 100000).length;
  return MAXC[k];
}
function vReview() {
  return '<p class="eyebrow">Ôn bài · Bước 1/2</p><h1>Chọn cách ôn</h1><p class="sub">Nội dung lấy từ bài giảng gốc: định nghĩa, phân loại, các bước, bảng so sánh.</p>' +
    '<div class="grid2"><button class="big c1" data-act="kind" data-v="cards"><span class="bt">Flashcard</span><span class="bd">Lật thẻ khái niệm, bước và bảng so sánh.</span><span class="go">Tiếp theo →</span></button>' +
    '<button class="big c2" data-act="kind" data-v="quiz"><span class="bt">Trắc nghiệm</span><span class="bd">Chọn 1 trong 4, có giải thích từ nội dung gốc.</span><span class="go">Tiếp theo →</span></button></div>';
}
function vSetup() {
  const isQ = S.kind === 'quiz', sc = S.scope === 'all' ? 'all' : +S.scope, max = maxFor(S.kind, sc);
  let n = isQ ? S.qn : S.cn; n = Math.max(1, Math.min(n, max)); if (isQ) S.qn = n; else S.cn = n;
  const unit = isQ ? 'câu' : 'thẻ';
  return '<p class="eyebrow">Ôn bài · Bước 2/2</p><h1>' + (isQ ? 'Trắc nghiệm' : 'Flashcard') + '</h1><p class="sub">Chọn chương rồi chọn số ' + unit + ' muốn ôn.</p>' +
    '<div class="card"><label class="pl" for="scope">Chủ đề</label><select id="scope" class="full"><option value="all">Tất cả chương</option>' + D.map((d, i) => '<option value="' + i + '"' + (String(S.scope) === String(i) ? ' selected' : '') + '>Chương ' + (i + 1) + ' — ' + esc(d.t) + '</option>').join('') + '</select>' +
    '<label class="pl" for="num" style="margin-top:1.1rem">Số ' + unit + ': <span class="big-n" id="numv">' + n + '</span> <span class="mutn">/ tối đa ' + max + '</span></label>' +
    '<input type="range" id="num" class="slider" min="1" max="' + max + '" step="1" value="' + n + '">' +
    '<div class="seg" style="margin-top:.7rem">' + [10, 20, 40].filter(x => x < max).map(x => '<button class="sg' + (n === x ? ' on' : '') + '" data-act="num" data-v="' + x + '">' + x + '</button>').join('') + '<button class="sg' + (n === max ? ' on' : '') + '" data-act="num" data-v="' + max + '">Tối đa (' + max + ')</button></div></div>' +
    '<div class="row"><button class="btn pri" data-act="' + (isQ ? 'quiz' : 'cards') + '">Bắt đầu</button></div>';
}

function vCards() {
  const n = S.cards.length;
  let h = '<p class="eyebrow">Flashcard</p>';
  if (!n) return h + '<p class="sub">Chưa có thẻ.</p>';
  const c = S.cards[S.ci];
  h += '<p class="progress">' + (S.ci + 1) + ' / ' + n + '</p><p class="sub">Chạm vào thẻ để lật.</p>';
  h += '<button class="fc' + (S.flip ? ' back' : '') + '" data-act="flip" aria-label="Lật thẻ">';
  if (!S.flip) h += (c.cat ? '<span class="cat">' + esc(c.cat) + ' · ' + esc(c.diff) + '</span>' : (c.x ? '<span class="cat">' + esc(c.x) + '</span>' : '')) + '<span class="ft">' + esc(c.front) + '</span>';
  else h += '<span class="bk">' + esc(c.back) + '</span><span class="src">' + esc(c.src) + '</span>';
  h += '</button><div class="row"><button class="btn" data-act="prev"' + (S.ci === 0 ? ' disabled' : '') + '>← Trước</button><button class="btn" data-act="next"' + (S.ci >= n - 1 ? ' disabled' : '') + '>Sau →</button><button class="btn" data-act="shuf">Xáo trộn</button></div>';
  return h;
}

function vQuiz() {
  if (!S.qz.length) return '<p class="eyebrow">Trắc nghiệm</p><p class="sub">Chưa đủ nội dung để ra câu hỏi trong phạm vi này.</p>';
  if (S.done) {
    const n = S.qz.length;
    return '<p class="eyebrow">Kết quả</p><h1>Đúng ' + S.sc + ' / ' + n + '</h1><div class="bar" aria-hidden="true"><i style="width:' + Math.round(S.sc / n * 100) + '%"></i></div>' +
      '<div class="row"><button class="btn pri" data-act="again">Làm lại</button>' + (S.wrong.length ? '<button class="btn" data-act="redo">Ôn lại ' + S.wrong.length + ' câu sai</button>' : '') + '<button class="btn" data-act="back">Chọn phạm vi khác</button></div>';
  }
  const q = S.qz[S.qi], L = 'ABCD';
  let h = '<p class="eyebrow">Trắc nghiệm</p><p class="progress">Câu ' + (S.qi + 1) + ' / ' + S.qz.length + (q.bloom ? ' · mức ' + esc(q.bloom) : '') + '</p><h2 class="qp">' + esc(q.p) + '</h2>';
  h += '<div class="opts">' + q.opts.map((o, i) => {
    let cls = 'opt';
    if (S.picked >= 0) { if (i === q.ai) cls += ' ok'; else if (i === S.picked) cls += ' no'; }
    return '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (S.picked >= 0 ? ' disabled' : '') + '><span class="L">' + L[i] + '</span><span>' + esc(o) + '</span></button>';
  }).join('') + '</div>';
  if (S.picked < 0 && q.h) h += '<button class="link" data-act="hint">' + (S.hint ? 'Ẩn gợi ý' : 'Gợi ý') + '</button>' + (S.hint ? '<p class="hint">' + esc(q.h) + '</p>' : '');
  if (S.picked >= 0) {
    const okk = S.picked === q.ai;
    h += '<div class="fb"><p class="vd ' + (okk ? 'ok' : 'no') + '">' + (okk ? 'Đúng.' : 'Chưa đúng.') + '</p><p><b>Đáp án đúng:</b> ' + esc(q.full) + '</p>' +
      (q.e ? '<p>' + esc(q.e) + '</p>' : '') + (!okk && q.note(S.picked) ? '<p>' + esc(q.note(S.picked)) + '</p>' : '') +
      '<p class="src">Nguồn: ' + esc(q.src) + '</p></div><div class="row"><button class="btn pri" data-act="nextq">' + (S.qi + 1 >= S.qz.length ? 'Xem kết quả' : 'Câu tiếp') + '</button></div>';
  }
  return h;
}

function vPop() {
  return '<div class="pop" id="pop" role="dialog" aria-label="Cài đặt giao diện">' +
    '<label for="size" class="pl">Cỡ chữ: <span id="sizev">' + set.size + 'px</span></label><input type="range" id="size" min="14" max="22" step="1" value="' + set.size + '">' +
    '<div class="pl">Theme</div><div class="seg">' + [['auto', 'Tự động'], ['light', 'Sáng'], ['dark', 'Tối']].map(t => '<button class="sg' + (set.theme === t[0] ? ' on' : '') + '" data-act="theme" data-v="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
    '<div class="pl">Màu chủ đạo</div><div class="swatches">' + ACCS.map(a => '<button class="sw' + (set.acc.toLowerCase() === a[0].toLowerCase() ? ' on' : '') + '" style="background:' + a[0] + '" data-act="acc" data-v="' + a[0] + '" aria-label="' + a[1] + '"></button>').join('') + '<input type="color" id="accpick" value="' + set.acc + '" aria-label="Chọn màu bất kỳ"></div>' +
    '<div class="pl">Phong cách hiển thị</div><div class="seg wrapseg">' + STYLES.map(s => '<button class="sg' + (set.style === s[0] ? ' on' : '') + '" data-act="style" data-v="' + s[0] + '">' + s[1] + '</button>').join('') + '</div>' +
    '<button class="link" data-act="reset">Đặt lại mặc định</button></div>';
}

function render() {
  $('#back').disabled = S.mode === 'home' && !S.hist.length;
  $('#gear').setAttribute('aria-expanded', S.pop ? 'true' : 'false');
  $('#popbox').innerHTML = S.pop ? vPop() : '';
  const v = { home: vHome, learn: vLearn, review: vReview, setup: vSetup, cards: vCards, quiz: vQuiz }[S.mode];
  $('#view').innerHTML = v();
}

/* ---------- sự kiện ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, i = +t.dataset.i, v = t.dataset.v;
  switch (a) {
    case 'to-review': go('review'); break;
    case 'to-learn': go('learn'); break;
    case 'chap': S.cur = i; S.step = 0; render(); window.scrollTo(0, 0); break;
    case 'step': S.step = i; render(); window.scrollTo(0, 0); break;
    case 'sprev': S.step--; render(); window.scrollTo(0, 0); break;
    case 'snext': S.step++; render(); window.scrollTo(0, 0); break;
    case 'drill': S.scope = S.cur; go('review'); break;
    case 'kind': S.kind = v; go('setup'); break;
    case 'num': if (S.kind === 'quiz') S.qn = +v; else S.cn = +v; render(); break;
    case 'cards': startCards(); break;
    case 'quiz': startQuiz(); break;
    case 'flip': S.flip = !S.flip; render(); break;
    case 'prev': if (S.ci > 0) { S.ci--; S.flip = false; render(); } break;
    case 'next': if (S.ci < S.cards.length - 1) { S.ci++; S.flip = false; render(); } break;
    case 'shuf': S.cards = shuf(S.cards); S.ci = 0; S.flip = false; render(); break;
    case 'pick': pick(i); break;
    case 'hint': S.hint = !S.hint; render(); break;
    case 'nextq': nextQ(); break;
    case 'again': startQuiz(); break;
    case 'redo': startQuiz(S.wrong.slice()); break;
    case 'back': back(); break;
    case 'theme': set.theme = v; applySet(); saveSet(); render(); break;
    case 'acc': set.acc = v; applySet(); saveSet(); render(); break;
    case 'style': set.style = v; applySet(); saveSet(); render(); break;
    case 'reset': set = Object.assign({}, DEF); applySet(); saveSet(); render(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'num') { render(); $('#num').focus(); }
  if (e.target.id === 'scope') { S.scope = e.target.value === 'all' ? 'all' : +e.target.value; render(); $('#scope').focus(); }
  if (e.target.id === 'accpick') { set.acc = e.target.value; applySet(); saveSet(); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'num') { const n = +e.target.value; if (S.kind === 'quiz') S.qn = n; else S.cn = n; const nv = $('#numv'); if (nv) nv.textContent = n; }
  if (e.target.id === 'size') { set.size = +e.target.value; applySet(); saveSet(); const sv = $('#sizev'); if (sv) sv.textContent = set.size + 'px'; }
});
$('#back').addEventListener('click', back);
$('#home').addEventListener('click', home);
$('#gear').addEventListener('click', () => { S.pop = !S.pop; render(); });
document.addEventListener('pointerdown', e => {
  if (S.pop && !e.target.closest('#popbox') && !e.target.closest('#gear')) { S.pop = false; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.pop) { S.pop = false; render(); $('#gear').focus(); return; }
  if (S.mode === 'cards' && !e.target.closest('select,input')) {
    if (e.key === 'ArrowRight' && S.ci < S.cards.length - 1) { S.ci++; S.flip = false; render(); }
    if (e.key === 'ArrowLeft' && S.ci > 0) { S.ci--; S.flip = false; render(); }
  }
});

applySet();
$('#gear').innerHTML = ICON_GEAR;
render();

</script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="hris-auth.js"></script>
</body></html>
