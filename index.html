<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10171e"><title>English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#10171e;--card:#18232d;--line:#2b3a48;--text:#e8edf2;--muted:#a1afbc;--teal:#159688;--blue:#4a91d1;--good:#69d69b;--bad:#ff8798;--serif:'Fraunces',Georgia,serif;--sans:'Source Sans 3',system-ui,sans-serif}
    :root[data-theme="light"]{color-scheme:light;--bg:#f5f7f9;--card:#fff;--line:#d5dde5;--text:#16222b;--muted:#586775;--good:#16824b;--bad:#b42338}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
    .auth-view,.wrap{width:min(48rem,100% - 2rem);margin:auto}.auth-view{padding:clamp(2rem,7vw,5rem) 0}.brand{font:700 clamp(2.3rem,7vw,4rem)/1.05 var(--serif);margin:.5rem 0 1rem}.sub{color:var(--muted);margin:.2rem 0 1.4rem}.auth-grid,.grid2,.grid3{display:grid;gap:1rem}.auth-grid,.grid2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.grid3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
    .card,.big,.auth-card,.lesson-card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:1.25rem}.auth-card{margin-top:1rem;padding:clamp(1.2rem,4vw,2rem)}.big,.lesson-card{width:100%;min-height:10rem;text-align:left;display:flex;flex-direction:column;gap:.4rem;transition:transform .12s,border-color .12s}.big:hover,.lesson-card:hover{transform:translateY(-2px);border-color:var(--teal)}.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700}.big h2,.lesson-card h3{font:700 1.5rem/1.2 var(--serif);margin:.2rem 0}.arrow{color:var(--teal);font-weight:700;margin-top:auto}.icon{width:2.7rem;height:2.7rem;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-size:1.25rem}
    .wrap{padding:1rem 0 4rem}.top{position:relative;display:flex;gap:.5rem;align-items:center;padding:.3rem 0 1rem;border-bottom:1px solid var(--line);margin-bottom:1.5rem}.top button{flex:none}.brand-small{font:700 1.2rem var(--serif)}.current-user{margin-left:auto;color:var(--muted);font-size:.9rem}.ib{width:2.5rem;height:2.5rem;border:1px solid var(--line);border-radius:12px;background:var(--card)}.link{border:0;background:none;color:var(--teal);text-decoration:underline;padding:.45rem .2rem;font-weight:700}.btn{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:.65rem 1rem;font-weight:700}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.full{width:100%;margin-top:.5rem}.auth-input,textarea{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:.75rem .85rem;margin:.35rem 0 1rem}.auth-error{color:var(--bad);min-height:1.5rem}.row,.tabbar,.chips{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin:1rem 0}.pill,.tab{border:1px solid var(--line);background:var(--card);padding:.4rem .8rem;border-radius:999px}.pill.active,.tab.active{background:var(--teal);border-color:var(--teal);color:white}.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:0 0 .3rem}h1,h2,h3{font-family:var(--serif);line-height:1.18}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:.2rem 0 .6rem}h2{font-size:1.35rem;margin:.2rem 0 .7rem}h3{font-size:1.1rem;margin:.4rem 0}.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:.6rem;margin:1rem 0}.stat{border:1px solid var(--line);border-radius:12px;padding:.8rem;background:color-mix(in srgb,var(--card) 85%,var(--bg))}.stat b{display:block;font:700 1.4rem var(--serif)}.stat span,.muted{color:var(--muted)}.progress{height:.55rem;border-radius:99px;background:var(--line);overflow:hidden;margin:.7rem 0}.progress i{display:block;height:100%;background:var(-     .reading p{margin:.7rem 0;font-size:1.06rem}.section-list{display:grid;gap:.6rem;padding:0;list-style:none}.section-list li{padding:.75rem;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 85%,var(--bg))}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:480px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:.65rem .8rem}th{color:var(--teal)}tr:last-child td{border:0}.fc{min-height:12rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;border:1px solid var(--line);border-radius:18px;background:var(--card);margin:1rem 0}.fc strong{font:700 clamp(1.4rem,4vw,2rem)/1.25 var(--serif)}.question{font-size:1.2rem}.option{width:100%;text-align:left;display:flex;gap:.7rem;margin:.5rem 0;padding:.75rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--card)}.option.correct{border-color:var(--good);color:var(--good)}.option.incorrect{border-color:var(--bad);color:var(--bad)}.feedback{border:1px solid var(--line);border-radius:12px;padding:1rem;margin:1rem 0;background:color-mix(in srgb,var(--card) 85%,var(--bg))}.score{font:700 2.2rem var(--serif);color:var(--teal)}.grammar-item{margin:.65rem 0}.grammar-item summary{cursor:pointer;font-weight:700;padding:.8rem}.grammar-content{padding:0 1rem 1rem;color:var(--muted);white-space:normal}.rule{font-family:ui-monospace,monospace;color:#f0e8d6}.roster-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.65rem 0;border-top:1px solid var(--line)}.roster-code{font-family:ui-monospace,monospace;letter-spacing:.05em;font-weight:700;color:var(--teal)}
    @media(max-width:520px){body{font-size:16px}.top{gap:.3rem}.top .ib{width:2.25rem;height:2.25rem}.current-user{max-width:7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card,.big,.lesson-card{padding:1rem}}
    :root:not([data-theme]){color-scheme:dark}
    @media(prefers-color-scheme:light){:root:not([data-theme]){color-scheme:light;--bg:#f5f7f9;--card:#fff;--line:#d5dde5;--text:#16222b;--muted:#586775;--good:#16824b;--bad:#b42338}}
    .settings-panel{padding:1rem;display:grid;gap:.6rem}.settings-head{display:flex;justify-content:space-between;align-items:center}.settings-head h2{margin:0}.setting-label{font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;align-items:center;margin-top:.25rem}.settings-panel input[type=range]{width:100%;accent-color:var(--teal)}.setting-options,.style-options,.swatches{display:flex;gap:.4rem;flex-wrap:wrap}.settings-panel .btn{padding:.4rem .65rem;font-size:.86rem}.settings-panel .btn.selected{background:var(--teal);border-color:var(--teal);color:#fff}.swatch{width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid var(--line);background:var(--swatch);cursor:pointer}.swatch.selected{outline:2px solid var(--text);outline-offset:2px}.custom-accent{width:1.8rem;height:1.8rem;border:1px dashed var(--line);border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer}.custom-accent input{position:absolute;inset:-.3rem;width:2.5rem;height:2.5rem;opacity:0;cursor:pointer}.reset-settings{justify-self:start}.fc{cursor:pointer;text-align:center;width:100%;color:var(--text)}.fc:focus-visible{outline:3px solid var(--teal);outline-offset:3px}.question-slider{width:100%;accent-color:var(--teal);cursor:pointer;margin:.4rem 0}.slider-limits{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}.slider-limits+button{margin-top:.8rem}
    #popbox .settings-panel{z-index:1001;max-height:min(75vh,42rem);overflow:auto;isolation:isolate;background:var(--card)!important;backdrop-filter:none!important;opacity:1}
    .student-record{margin:.8rem 0}.student-record-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}.student-record-head h2{margin:0}.status-pill{font-size:.75rem;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:.2rem .6rem}.status-active{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}.status-inactive{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}.student-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:.6rem;margin:.9rem 0}.student-stats>div{padding:.65rem;border:1px solid var(--line);border-radius:10px}.student-stats b,.student-stats span{display:block}.student-stats span{font-size:.83rem;color:var(--muted)}.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}.roster-toolbar{justify-content:space-between;align-items:center}
    :root[data-style="flat"] .card,:root[data-style="flat"] .big,:root[data-style="flat"] .lesson-card,:root[data-style="flat"] .auth-card,:root[data-style="flat"] .fc,:root[data-style="flat"] .btn,:root[data-style="flat"] .option{border-radius:6px;box-shadow:none}
    :root[data-style="glass"] .card,:root[data-style="glass"] .big,:root[data-style="glass"] .lesson-card,:root[data-style="glass"] .auth-card,:root[data-style="glass"] .fc,:root[data-style="glass"] .btn{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 78%,transparent)}
    :root[data-style="neu"] .card,:root[data-style="neu"] .big,:root[data-style="neu"] .lesson-card,:root[data-style="neu"] .auth-card,:root[data-style="neu"] .fc{border-color:transparent;box-shadow:5px 5px 14px color-mix(in srgb,var(--text) 14%,transparent),-5px -5px 14px color-mix(in srgb,var(--card) 85%,transparent)}
    :root[data-style="brutal"] .card,:root[data-style="brutal"] .big,:root[data-style="brutal"] .lesson-card,:root[data-style="brutal"] .auth-card,:root[data-style="brutal"] .fc,:root[data-style="brutal"] .btn{border:2px solid var(--text);border-radius:0;box-shadow:4px 4px 0 var(--text)}:root[data-style="brutal"] h1,:root[data-style="brutal"] h2,:root[data-style="brutal"] h3{font-family:ui-monospace,monospace}
    :root[data-style="clay"] .card,:root[data-style="clay"] .big,:root[data-style="clay"] .lesson-card,:root[data-style="clay"] .auth-card,:root[data-style="clay"] .fc{border-radius:30px;box-shadow:0 8px 20px color-mix(in srgb,var(--text) 13%,transparent)}
    :root[data-style="minimal"] .card,:root[data-style="minimal"] .big,:root[data-style="minimal"] .lesson-card,:root[data-style="minimal"] .auth-card,:root[data-style="minimal"] .fc{box-shadow:none;border-color:transparent;background:transparent}
    :root[data-style="retro"] .card,:root[data-style="retro"] .big,:root[data-style="retro"] .lesson-card,:root[data-style="retro"] .auth-card,:root[data-style="retro"] .fc,:root[data-style="retro"] .btn{border-style:dashed;border-radius:0;box-shadow:none}:root[data-style="retro"] h1,:root[data-style="retro"] h2,:root[data-style="retro"] h3{font-family:ui-monospace,monospace}
    #popbox .settings-panel .btn.selected{background:var(--teal)!important;border-color:var(--teal)!important;color:#fff!important}
    .auth-view,.wrap{width:min(72rem,100% - 2rem)}.card,.big,.lesson-card,.auth-card{box-shadow:0 8px 28px color-mix(in srgb,var(--text) 6%,transparent)}.btn,.big,.lesson-card,.tab{transition:transform .16s ease,border-color .16s ease,background-color .16s ease}.btn:hover:not(:disabled){border-color:var(--teal)}.big:hover,.lesson-card:hover{transform:translateY(-2px)}
    .practice-heading{max-width:48rem;margin:0 auto 1rem}.step-track{display:flex;align-items:center;gap:.75rem;max-width:50rem;margin:1.5rem auto 1.2rem;color:var(--muted)}.step-track>i{height:1px;flex:1;background:var(--line)}.step{display:flex;align-items:center;gap:.55rem;white-space:nowrap;font-size:.9rem}.step>span{width:1.85rem;height:1.85rem;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700}.step.current{color:var(--text)}.step.current>span,.step.complete>span{background:var(--teal);color:white}.step.complete{color:var(--teal)}.practice-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1.2rem}.practice-choice{min-height:16rem;text-align:left;padding:1.4rem;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;box-shadow:0 8px 28px color-mix(in srgb,var(--text) 6%,transparent)}.practice-choice:hover,.practice-choice:focus-visible{border-color:var(--teal);transform:translateY(-3px)}.choice-kicker,.choice-count{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--teal)}.choice-title{font:700 1.65rem/1.16 var(--serif);margin-top:.6rem}.choice-description{color:var(--muted);max-width:24rem}.choice-count{margin-top:auto;letter-spacing:.04em}.choice-cta{font-weight:700;color:var(--teal)}.practice-config{max-width:48rem;margin:0 auto;padding:clamp(1.1rem,3vw,2rem)}.config-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding-bottom:1rem;margin-bottom:1.1rem;border-bottom:1px solid var(--line)}.config-top h2{font:700 1.8rem/1.2 var(--serif);margin:.1rem 0}.config-top .muted{margin:.2rem 0}.packet-select{width:100%;padding:.8rem 1rem;margin:.55rem 0 1.2rem;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.count-config{padding:1rem;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--card) 80%,var(--bg))}.count-config .setting-label{font-size:1rem}.count-config .setting-label>b{font-size:1.2rem;color:var(--teal)}.count-config .slider-limits{font-size:.8rem}.start-practice{min-height:3.3rem;margin-top:1rem!important}.config-summary{display:flex;align-items:center;gap:.9rem;margin:1.2rem 0;padding:.9rem 0}.config-summary b,.config-summary .muted{display:block}.summary-icon{width:2.7rem;height:2.7rem;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--teal) 14%,var(--card));color:var(--teal);font-size:1.2rem}
    .grammar-heading{max-width:54rem}.grammar-item{margin:0;border-bottom:1px solid var(--line)}.grammar-item:first-of-type{border-top:1px solid var(--line)}.grammar-item summary{cursor:pointer;font-weight:700;padding:.62rem .7rem;line-height:1.35;list-style:none;display:flex;align-items:center;gap:.65rem}.grammar-item summary::-webkit-details-marker{display:none}.grammar-item summary::before{content:'＋';width:1.35rem;height:1.35rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--teal);font-size:.85rem;flex:none}.grammar-item[open] summary::before{content:'−';background:var(--teal);border-color:var(--teal);color:#fff}.topic-id{font:600 .82rem ui-monospace,monospace;color:var(--teal);min-width:3.8rem}.grammar-content{padding:.25rem .8rem .8rem 2.7rem;line-height:1.55}.grammar-content p{margin:.35rem 0}.grammar-card>h2{margin-bottom:.8rem}.grammar-tabs{overflow-x:auto;flex-wrap:nowrap;padding:.2rem 0 .55rem}.grammar-tabs .tab{white-space:nowrap}.grammar-search{width:100%;padding:.72rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:.4rem 0 1rem}
    .grammar-parent{margin:0;border-bottom:1px solid var(--line)}.grammar-parent:first-of-type{border-top:1px solid var(--line)}.grammar-parent summary{cursor:pointer;font-weight:700;padding:.72rem .7rem;line-height:1.35;list-style:none;display:flex;align-items:center;gap:.65rem}.grammar-parent summary::-webkit-details-marker{display:none}.grammar-parent summary::before{content:'＋';width:1.35rem;height:1.35rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--teal);font-size:.85rem;flex:none}.grammar-parent[open]>summary::before{content:'−';background:var(--teal);border-color:var(--teal);color:#fff}.grammar-children{margin-left:1.35rem;padding-left:.5rem;border-left:1px solid var(--line)}.grammar-parent summary:focus-visible,.grammar-item summary:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
    @media(max-width:760px){.practice-choice-grid{grid-template-columns:1fr}.practice-choice{min-height:0}.step-track{gap:.4rem}.step{font-size:.76rem;gap:.3rem}.step-track>i{min-width:.5rem}.config-top{flex-direction:column}.grammar-content{padding-left:1rem}}
  </style>
</head>
<body>
  <div id="auth-view" class="auth-view"></div>
  <div class="wrap" id="app-root" hidden>
    <header class="top"><button class="ib" id="back" aria-label="Back">←</button><button class="ib" id="home" aria-label="Home">⌂</button><span class="brand-small">English Studio</span><span class="current-user" id="current-user"></span><button class="link" data-auth="logout" id="logout" hidden>Log out</button><button class="ib" id="gear" aria-label="Settings">⚙</button><div id="popbox"></div></header>
    <main id="view"></main>
  </div>
  <script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="content/phase1-data.js"></script><script src="content/grammar-data.js"></script><script src="app.js"></script><script src="auth.js"></script>
</body>
</html>
